# Construye «Kevil Studio.exe» en una máquina con Windows.
#
# PyInstaller no sabe hacer un ejecutable de Windows desde Linux ni desde
# macOS: tiene que construirse en el mismo sistema. Este flujo lo hace por ti
# en un Windows de GitHub, así que no necesitas montar nada en tu equipo.
#
# Cómo usarlo:
#   1. En GitHub, pestaña «Actions» → «Construir el .exe» → «Run workflow».
#   2. Cuando termine (unos 5 minutos), baja el .zip de «Artifacts».
#   3. Dentro está «Kevil Studio.exe». Doble clic y listo.

name: Construir el .exe

on:
  workflow_dispatch:
    inputs:
      con_ffmpeg:
        description: "Incluir ffmpeg dentro (el .exe no necesita instalar nada)"
        type: boolean
        default: true
      publicar:
        description: "Dejarlo en Releases, para poder descargarlo con un clic"
        type: boolean
        default: true
      version:
        description: "Nombre de la version (por ejemplo v1.0.0)"
        type: string
        default: "v1.0.0"
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    # hace falta para poder dejar el .exe colgado en la release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ventana.txt
          pip install "pyinstaller>=6.3"

      - name: Traer ffmpeg
        if: ${{ inputs.con_ffmpeg != false }}
        shell: pwsh
        run: |
          # El paquete de Chocolatey deja un lanzador de unos pocos KB que
          # apunta al binario real. Metido en el .exe no sirve de nada, asi que
          # se baja la version estatica directamente.
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-descargado
          $bin = (Get-ChildItem -Recurse -Filter "ffmpeg.exe" ffmpeg-descargado |
                  Select-Object -First 1).Directory.FullName
          if (-not $bin) { throw "No se ha encontrado ffmpeg.exe en el paquete" }
          "KEVIL_FFMPEG_DIR=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "ffmpeg en $bin"

      - name: Comprobar que las pruebas pasan
        run: |
          pip install pytest
          python -m pytest tests -q

      # Dos formatos a proposito. El de un solo archivo se descomprime solo en
      # una carpeta temporal al arrancar, que es lo mismo que hace el malware
      # para esconderse, y Windows Defender lo marca a menudo sin motivo. El de
      # carpeta no hace eso y apenas da falsos positivos: es el recomendado.
      - name: Construir (carpeta, el recomendado)
        run: python construir.py --carpeta ${{ (inputs.con_ffmpeg != false) && '--con-ffmpeg' || '' }}

      - name: Empaquetar la carpeta en un zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Kevil Studio/*" `
            -DestinationPath "dist/Kevil-Studio-Windows.zip" -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item "dist/Kevil-Studio-Windows.zip").Length / 1MB)
          Write-Host "El zip pesa $mb MB"

      - name: Construir (un solo archivo)
        run: python construir.py ${{ (inputs.con_ffmpeg != false) && '--con-ffmpeg' || '' }}

      - name: Comprobar que ffmpeg ha entrado de verdad
        if: ${{ inputs.con_ffmpeg != false }}
        shell: pwsh
        run: |
          # Sin ffmpeg dentro, el .exe no puede cortar ni montar nada. Si no ha
          # entrado, mejor fallar aqui que entregar algo que no sirve.
          $exe = Get-Item "dist/Kevil Studio.exe"
          $mb = [math]::Round($exe.Length / 1MB)
          Write-Host "El ejecutable pesa $mb MB"
          if ($mb -lt 90) {
            throw "Pesa $mb MB: ffmpeg no ha entrado en el paquete"
          }

      - name: Comprobar que el ejecutable arranca
        shell: pwsh
        run: |
          $exe = "dist/Kevil Studio.exe"
          if (-not (Test-Path $exe)) { throw "No se ha construido el ejecutable" }

          $env:KEVIL_PORT = "8899"
          $env:KEVIL_WINDOW_MODE = "navegador"
          $env:KEVIL_DATA_DIR = "$PWD/datos-de-prueba"

          # Se captura la salida: si no arranca, hay que poder ver por que
          $proceso = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput salida.txt -RedirectStandardError errores.txt

          $vivo = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 3
            if ($proceso.HasExited) { break }
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8899/api/status" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $vivo = $true; break }
            } catch { }
          }
          Stop-Process -Id $proceso.Id -Force -ErrorAction SilentlyContinue

          if (-not $vivo) {
            Write-Host "--- salida ---"
            if (Test-Path salida.txt) { Get-Content salida.txt -Tail 60 }
            Write-Host "--- errores ---"
            if (Test-Path errores.txt) { Get-Content errores.txt -Tail 60 }
            Write-Host "--- registro de arranque ---"
            Get-ChildItem -Recurse -Filter "error-al-arrancar.txt" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -Tail 60 }
            Get-ChildItem -Recurse -Filter "kevil.log" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -Tail 60 }
            throw "El ejecutable no ha llegado a responder"
          }
          Write-Host "El ejecutable arranca y responde."

      - uses: actions/upload-artifact@v4
        with:
          name: Kevil-Studio-Windows
          path: |
            dist/Kevil-Studio-Windows.zip
            dist/Kevil Studio.exe
          retention-days: 30

      # La pagina de Releases es la unica que da un enlace de descarga directo y
      # permanente. Los artefactos de Actions caducan y estan escondidos.
      - name: Dejarlo en Releases
        if: ${{ inputs.publicar != false || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Kevil Studio ${{ inputs.version || github.ref_name }}
          body: |
            ## Descarga

            ### ⬇️ Kevil-Studio-Windows.zip  ← **usa este**

            Descomprímelo donde quieras y abre `Kevil Studio.exe` de dentro.
            No necesitas instalar nada: lleva ffmpeg incluido.

            ### Kevil Studio.exe (un solo archivo)

            Lo mismo en un único archivo, más cómodo de mover.
            **Windows Defender suele marcarlo como virus sin serlo**: un ejecutable
            que se descomprime solo al arrancar se parece a lo que hace el malware,
            y al no estar firmado digitalmente salta la alarma. Si te pasa, usa el
            `.zip` de arriba, que no tiene ese problema.

            ---

            Tus datos se guardan en una carpeta `data` junto al programa, así que
            déjalo en una carpeta suya y no en Descargas.

            Antes de publicarse ha pasado las pruebas en Windows y se ha comprobado
            que ffmpeg está dentro y que el ejecutable arranca y responde.
          files: |
            dist/Kevil-Studio-Windows.zip
            dist/Kevil Studio.exe
          fail_on_unmatched_files: true
